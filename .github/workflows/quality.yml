name: quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pure-tests:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install locked test dependencies
        run: python -m pip install -c requirements/constraints.txt -e ".[test]"
      - name: Python 3.9 syntax and focused static checks
        run: |
          python -m compileall -q libremark_pdf tests tools
          ruff check libremark_pdf tests tools
      - name: Pure browser-free tests
        run: python tools/run_tests.py pure

  browser-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.9"
          cache: pip
      - name: Install locked test dependencies
        run: python -m pip install -c requirements/constraints.txt -e ".[test]"
      - name: Install locked Chromium headless shell
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/libremark-browsers
        run: python -m playwright install --with-deps --only-shell chromium
      - name: Full suite with coverage
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/libremark-browsers
        run: |
          xvfb-run -a python tools/run_tests.py all --coverage
          coverage report
          coverage xml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-python-3.9
          path: coverage.xml

  source-hygiene:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.9"
      - run: python tools/check_source_hygiene.py
      - name: Build and inspect source archive
        run: |
          git archive --format=tar HEAD > "${RUNNER_TEMP}/libremark-source.tar"
          tar -tf "${RUNNER_TEMP}/libremark-source.tar" > "${RUNNER_TEMP}/manifest.txt"
          python tools/check_source_hygiene.py --manifest "${RUNNER_TEMP}/manifest.txt"
