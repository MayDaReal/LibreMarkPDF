[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "libremark-pdf"
dynamic = ["version"]
description = "Local Markdown-to-PDF desktop and command-line converter"
readme = "README.md"
requires-python = ">=3.9"
license = {file = "LICENSE"}
authors = [{name = "LibreMark PDF contributors"}]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "Markdown==3.9",
  "playwright==1.60.0",
]

[project.optional-dependencies]
gui = [
  "customtkinter==6.0.0",
  "pillow==12.3.0",
  "pypdfium2==5.11.0",
  "tkinterdnd2==0.7.0",
]
build = [
  "customtkinter==6.0.0",
  "pillow==12.3.0",
  "pypdfium2==5.11.0",
  "tkinterdnd2==0.7.0",
  "pyinstaller==6.22.3",
  "setuptools==84.2.1",
]
test = [
  "customtkinter==6.0.0",
  "pillow==12.3.0",
  "pypdfium2==5.11.0",
  "tkinterdnd2==0.7.0",
  "coverage[toml]==7.16.2",
  "ruff==0.17.6",
]
docs = []

[project.scripts]
libremark-pdf = "libremark_pdf.__main__:main"

[tool.setuptools.dynamic]
version = {attr = "libremark_pdf.__version__"}

[tool.setuptools.packages.find]
include = ["libremark_pdf*"]

[tool.setuptools.data-files]
"libremark_pdf" = ["VERSION", "style.css", "LICENSE", "THIRD_PARTY_NOTICES.md"]
"libremark_pdf/docs" = ["docs/CLI_JSON_SCHEMA.json", "docs/THEME_CONTRIBUTING.md"]
"libremark_pdf/icons" = [
  "icons/icons_check.png",
  "icons/icons_no_entry.png",
  "icons/icons_orange.png",
  "icons/icons_repeat.png",
  "icons/icons_warning.png",
]
"libremark_pdf/assets" = [
  "assets/libremark-pdf-logo-128.png",
  "assets/libremark-pdf-logo-16.png",
  "assets/libremark-pdf-logo-256.png",
  "assets/libremark-pdf-logo-32.png",
  "assets/libremark-pdf-logo-48.png",
  "assets/libremark-pdf-logo-64.png",
  "assets/libremark-pdf.ico",
]
"libremark_pdf/assets/ui-icons" = ["assets/ui-icons/manifest.json"]
"libremark_pdf/assets/ui-icons/svg" = ["assets/ui-icons/svg/*.svg"]
"libremark_pdf/assets/ui-icons/png" = ["assets/ui-icons/png/*.png"]
"libremark_pdf/fonts" = [
  "fonts/NotoEmoji.ttf",
  "fonts/NotoSans-Regular.ttf",
  "fonts/NotoSans-SemiBold.ttf",
  "fonts/NotoSansArabic-Regular.ttf",
  "fonts/NotoSansCJKsc-Regular.otf",
  "fonts/NotoSansMono-Regular.ttf",
  "fonts/NotoSansSymbols2-Regular.ttf",
]
"libremark_pdf/licenses" = [
  "licenses/Bootstrap-Icons-LICENSE.txt",
  "licenses/CustomTkinter-LICENSE.txt",
  "licenses/NotoCJK-OFL.txt",
  "licenses/NotoDistribution-OFL.txt",
  "licenses/NotoEmoji-OFL.txt",
  "licenses/NotoSansSymbols2-OFL.txt",
]

[tool.coverage.run]
branch = true
source = ["libremark_pdf"]

[tool.coverage.report]
# The complete Linux/Xvfb suite currently exceeds this branch-aware floor.
fail_under = 75
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py39"
line-length = 88
exclude = ["venv", "venv-linux", "build", "dist", "browsers"]

[tool.ruff.lint]
# Syntax/undefined-name failures only for the first gate; formatting is not yet
# authoritative and existing style is intentionally left untouched.
select = ["E9", "F63", "F7", "F82"]
